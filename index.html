
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizMaster | Interactive Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0">QuizMaster <span>✦</span></h2>
        <small class="muted">Test your web development skills</small>
      </div>
      <button id="themeBtn" class="btn theme-btn" type="button">🌙 Dark</button>
    </header>

    <section id="quiz" class="quiz-card mx-auto">
      <div class="d-flex justify-content-between mb-3 small">
        <span id="counter">Question 1 / 5</span>
        <strong id="timer" class="timer">⏱ 60s</strong>
      </div>

      <div id="progress" class="segments mb-4" aria-label="Quiz progress"></div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge text-bg-primary">WEB QUIZ</span>
        <span class="muted small">Choose one answer</span>
      </div>

      <h4 id="question" class="fw-bold my-4">Loading question...</h4>
      <div id="options" class="d-grid gap-2"></div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <span id="feedback" class="small" aria-live="polite"></span>
        <button id="nextBtn" class="btn btn-success px-4" disabled>
          Next →
        </button>
      </div>
    </section>

    <section id="result" class="quiz-card mx-auto d-none">
      <div class="text-center py-3">
        <div class="result-icon">🏆</div>
        <h2 class="fw-bold">Quiz Completed!</h2>
        <p class="muted">Here is your performance summary.</p>
        <h1 id="score" class="display-4 fw-bold"></h1>
        <p id="summary"></p>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr>
            <th>Question</th><th>Your Answer</th>
            <th>Correct Answer</th><th>Status</th>
          </tr></thead>
          <tbody id="resultRows"></tbody>
        </table>
      </div>
      <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
        <button id="pdfBtn" class="btn btn-primary">⬇ Download PDF</button>
        <button id="restartBtn" class="btn btn-success">↻ Try Again</button>
      </div>
    </section>

    <p class="text-center muted small mt-4">
      Built with HTML, CSS, JavaScript & Bootstrap
    </p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
